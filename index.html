<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso</title>
<style>
:root { --bg:#f4f6f8; --surface:#fff; --ink:#17212b; --muted:#5d6b79; --line:#dde3e9; --accent:#1d4f7c; --err:#b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f151b; --surface:#18212a; --ink:#e7edf3; --muted:#93a2b1; --line:#2a3541; --accent:#7fb2e0; --err:#f2b8b5; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
label { font-size: 14px; color: var(--muted); }
input { font: inherit; font-size: 17px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; padding: 12px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
@media (prefers-color-scheme: dark) { button { color: #0f151b; } }
#e { margin: 0; min-height: 1.3em; font-size: 14px; color: var(--err); }
</style>
</head>
<body>
<form id="f">
  <h1>Acceso</h1>
  <label for="p">Contraseña</label>
  <input id="p" type="password" autocomplete="current-password" autofocus required>
  <button type="submit" id="b">Entrar</button>
  <p id="e" role="alert"></p>
</form>
